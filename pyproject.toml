[project]
name = "abbot"
version = "0.1.0"
description = "Private automation hub for managing Monks"
readme = "README.md"
authors = [
    { name = "rymu219", email = "89217453+rymu219@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "kalshi-python-sync>=3.0.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic",
    "click",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-dotenv",
    "apscheduler>=3.10",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
abbot = "abbot.cli.main:cli"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
